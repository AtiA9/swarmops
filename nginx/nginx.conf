worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS at 127.0.0.11 re-resolves service names on every TTL
    # expiry, which is what lets this pick up both `api` replicas instead of
    # caching a single IP forever the way a static `upstream {}` block would.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        location /api/ {
            # `set` must come before `rewrite ... break;` - break halts the rest of the
            # rewrite-phase directives in this location, so a `set` placed after it would
            # never run. The variable is still what makes proxy_pass re-resolve `api`
            # against Docker's embedded DNS (see `resolver` above) instead of caching it.
            set $api_upstream http://api:5000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 10s;
        }

        location /grafana/ {
            set $grafana_upstream http://grafana:3000;
            rewrite ^/grafana/(.*)$ /$1 break;
            proxy_pass $grafana_upstream;
            proxy_set_header Host $host;
        }

        location = / {
            default_type application/json;
            return 200 '{"service":"swarmops-nginx","see":["/api/health","/api/status","/grafana/"]}';
        }
    }
}
