---
# Runs against the EC2 host Terraform created (../terraform/). Installs Docker, ships
# the repo (compose files + the config nginx/postgres/prometheus/grafana mount at
# runtime), and brings the stack up with `docker compose up -d` - no manual SSH
# fiddling, no "ran it once by hand and forgot".
#
# Secrets (swarmops_postgres_password, swarmops_grafana_admin_password) are never
# hardcoded here - supply them via `ansible-vault` or `--extra-vars` at run time:
#   ansible-playbook -i inventory.ini playbook.yml --ask-vault-pass
- name: Deploy SwarmOps
  hosts: swarmops
  become: true
  vars:
    swarmops_dir: /opt/swarmops
    swarmops_repo: https://github.com/AtiA9/swarmops.git
    swarmops_version: main
    swarmops_image_registry: ghcr.io/atia9
    swarmops_image_tag: latest
    # The services a real deployment runs - deliberately excludes `simulator`,
    # which is fake test traffic for local dev, not something you'd run in prod.
    swarmops_services: nginx api redis postgres worker prometheus grafana

  tasks:
    - name: Install prerequisite packages
      apt:
        name: ["ca-certificates", "curl", "gnupg", "git"]
        state: present
        update_cache: true

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch={{ ansible_architecture }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine + Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add deploy user to the docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Clone/update the SwarmOps repo (gets docker-compose.yml + all mounted config)
      git:
        repo: "{{ swarmops_repo }}"
        dest: "{{ swarmops_dir }}"
        version: "{{ swarmops_version }}"
        force: true

    - name: Write .env from vault-supplied secrets (never hardcoded)
      template:
        src: templates/env.j2
        dest: "{{ swarmops_dir }}/.env"
        mode: "0600"

    - name: Pull pre-built, scanned images from the registry
      command: docker compose -f docker-compose.yml -f docker-compose.prod.yml pull {{ swarmops_services }}
      args:
        chdir: "{{ swarmops_dir }}"

    - name: Start SwarmOps
      command: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d {{ swarmops_services }}
      args:
        chdir: "{{ swarmops_dir }}"
