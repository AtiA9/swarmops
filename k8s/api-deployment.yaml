# replicas: 2 for real, behind a Service - the stage-6 requirement. The API is
# stateless (all state lives in Redis), so this scales cleanly with no coordination.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarmops-api
  namespace: swarmops
spec:
  replicas: 2
  selector:
    matchLabels: { app: swarmops-api }
  template:
    metadata:
      labels: { app: swarmops-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/atia9/swarmops-api:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef: { name: swarmops-config }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
