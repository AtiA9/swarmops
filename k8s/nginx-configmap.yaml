# Simpler than nginx/nginx.conf (the docker-compose version): in Docker Compose,
# the service name resolves directly to each container's IP, so nginx needs the
# resolver+variable trick to see both `api` replicas. In Kubernetes, the
# swarmops-api Service is already a stable ClusterIP that kube-proxy load-balances
# across both pods - a plain static proxy_pass is enough.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: swarmops
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      server {
        listen 80;

        location /api/ {
          rewrite ^/api/(.*)$ /$1 break;
          proxy_pass http://swarmops-api:5000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
        }

        location /grafana/ {
          rewrite ^/grafana/(.*)$ /$1 break;
          proxy_pass http://grafana:3000;
          proxy_set_header Host $host;
        }

        location = / {
          default_type application/json;
          return 200 '{"service":"swarmops-nginx","see":["/api/health","/api/status","/grafana/"]}';
        }
      }
    }
