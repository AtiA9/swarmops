# Template only - never committed with real values (see .gitignore for k8s/secret.yaml).
# In a real cluster this is deliberately NOT synced by ArgoCD from this repo; create it
# out-of-band instead, e.g.:
#
#   kubectl create secret generic swarmops-secrets -n swarmops \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=GRAFANA_ADMIN_PASSWORD="$(openssl rand -base64 24)"
#
# or, better for a GitOps-managed fleet: a Sealed Secret / External Secrets Operator
# entry that references a real secret store (Vault, AWS Secrets Manager, etc.) - that
# satisfies "no hardcoded secret, everything through secrets/Vault" without ever
# putting plaintext in git, sealed or not.
apiVersion: v1
kind: Secret
metadata:
  name: swarmops-secrets
  namespace: swarmops
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE-ME"
  GRAFANA_ADMIN_PASSWORD: "CHANGE-ME"
