global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: swarmops-api
    # api runs as 2+ replicas behind the same service name - dns_sd_configs (rather
    # than static_configs) resolves that name to every replica's IP separately, so
    # each replica shows up as its own scrape target/time series instead of
    # Prometheus randomly landing on whichever one Docker's round-robin DNS returns.
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 5000
        refresh_interval: 15s

  - job_name: swarmops-worker
    static_configs:
      - targets: ["worker:9200"]
